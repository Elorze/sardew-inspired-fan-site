<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="种种大世界汇集故事、原创画面、社区内容与旗下三款产品。"
    />
    <title>种种大世界</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css?v=20260729-home-depth" />
    <link rel="stylesheet" href="home-experience.css?v=20260730-text-align" />
  </head>
  <body data-page="index.html">
    <div data-site-header></div>

    <main>
      <section class="home-hero" data-home-depth>
        <h1 class="visually-hidden">种种大世界</h1>
        <div class="home-depth-scene" aria-hidden="true">
          <div class="home-depth-layer-wrap home-depth-cloud-wrap">
            <img
              class="home-depth-layer home-depth-cloud"
              src="assets/home-depth-background.png"
              alt=""
            />
          </div>
          <div class="home-depth-companions-wrap">
            <img
              class="home-depth-companions"
              src="assets/home-depth-companions-side-alpha-v1.png"
              alt=""
            />
          </div>
          <div class="home-depth-spirit-wrap">
            <img
              class="home-depth-spirit"
              src="assets/home-watered-spirit-alpha-v1.png"
              alt=""
            />
          </div>
          <div class="home-depth-logo-wrap">
            <img
              class="home-depth-logo"
              src="assets/home-depth-logo-cropped.png"
              alt=""
            />
          </div>
        </div>
      </section>

      <section class="home-showcase" aria-label="游戏实机画面">
        <p class="home-color-note home-color-note-top">
          <span class="home-note-unit">
            <span>风从花园吹过来，世界正在醒来</span>
            <small>THE GARDEN IS WAKING</small>
          </span>
        </p>

        <div class="home-dual-showcase">
          <div
            class="home-motion-view"
            role="region"
            aria-roledescription="轮播"
            aria-label="可手动切换的游戏画面"
            tabindex="0"
          >
            <div class="home-motion-track" data-active-slide="0">
              <figure class="home-motion-slide" aria-hidden="false">
                <img
                  src="assets/gameplay-world.png"
                  alt="种种世界花园实机画面"
                  decoding="async"
                />
              </figure>
              <figure class="home-motion-slide" aria-hidden="true">
                <img
                  src="assets/gameplay-tavern.png"
                  alt="种种酒馆实机画面"
                  loading="lazy"
                  decoding="async"
                />
              </figure>
              <figure class="home-motion-slide" aria-hidden="true">
                <img
                  src="assets/gameplay-dandelion.png"
                  alt="蒲公英大世界实机画面"
                  loading="lazy"
                  decoding="async"
                />
              </figure>
            </div>
            <button
              class="home-motion-arrow home-motion-arrow-prev"
              type="button"
              aria-label="上一幅画面"
              title="上一幅画面"
            >
              <span aria-hidden="true">‹</span>
            </button>
            <button
              class="home-motion-arrow home-motion-arrow-next"
              type="button"
              aria-label="下一幅画面"
              title="下一幅画面"
            >
              <span aria-hidden="true">›</span>
            </button>
          </div>

          <figure class="home-still-view">
            <img
              src="assets/product-world-thumb.png"
              alt="种种世界花园全景静帧"
              loading="lazy"
              decoding="async"
            />
          </figure>
        </div>

        <p class="home-color-note home-color-note-bottom">
          <span class="home-note-unit">
            <span>慢慢走，每次回来都会遇见新的朋友</span>
            <small>A NEW PATH, A NEW FRIEND</small>
          </span>
        </p>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="site-shell.js?v=20260729-header-avatar"></script>
    <script src="script.js?v=20260729-home-depth"></script>
    <script src="home-experience.js?v=20260730-spirit-zone"></script>
  </body>
</html>
