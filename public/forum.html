<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="种种大世界的伙伴交流与植物成长记录。" />
    <title>花园广场｜种种大世界</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css?v=20260731-social-alignment" />
    <link rel="stylesheet" href="forum.css?v=20260730-real-interactions" />
  </head>
  <body data-page="forum.html">
    <div data-site-header></div>

    <main class="forum-main">
      <h1 class="visually-hidden">花园广场</h1>

      <section class="forum-speech-garden" aria-label="话语花园">
        <div class="forum-speech-bed" id="forumSpeechBed" aria-live="polite"></div>
        <article class="forum-picked-speech" id="forumPickedSpeech" hidden>
          <img src="assets/forum-avatars/new-lilybell.png" alt="" />
          <div>
            <strong></strong>
            <p></p>
            <a href="forum-post.html?id=welcome">进入话题</a>
          </div>
        </article>
      </section>

      <div class="forum-compose-entry">
        <a class="forum-new-post-button" href="forum-compose.html">写下新话题 <span aria-hidden="true">↗</span></a>
        <p>把今天的发现、问题或一小段故事，留在花园里。</p>
      </div>

      <nav class="forum-categories" id="forumCategories" aria-label="社区分栏">
        <button type="button" data-forum-category="all" aria-selected="true">
          全部
        </button>
        <button type="button" data-forum-category="world" aria-selected="false">
          世界
        </button>
        <button type="button" data-forum-category="plants" aria-selected="false">
          植物
        </button>
        <button type="button" data-forum-category="tavern" aria-selected="false">
          酒馆
        </button>
        <button type="button" data-forum-category="creative" aria-selected="false">
          创作
        </button>
        <button type="button" data-forum-category="help" aria-selected="false">
          互助
        </button>
      </nav>

      <div class="forum-plaza-layout">
        <section class="forum-board" id="forumBoard" aria-label="开放话题" aria-live="polite"></section>

        <aside class="forum-member-panel" aria-label="广场状态">
          <div class="forum-rewards" data-forum-rewards>
            <button
              class="forum-reward-avatar"
              id="forumAvatarPicker"
              type="button"
              aria-label="更换游客头像"
              title="点击更换游客头像"
            >
              <img
                id="forumMemberAvatar"
                src="assets/forum-avatars/new-cattail.png"
                alt=""
              />
            </button>
            <strong id="forumMemberName">游客</strong>
            <span id="forumMemberLevel">LV.0 游园</span>
            <span class="forum-points">
              <b id="forumPoints">0</b>
              <small>积分</small>
            </span>
            <output id="forumCheckInStatus" aria-live="polite"></output>
          </div>
          <div class="forum-interactions" aria-label="花园互动">
            <button id="forumCheckIn" type="button">
              <img src="assets/forum-avatars/new-cattail.png" alt="" />
              <span>签到</span>
            </button>
            <button id="forumGardenWater" type="button">
              <img src="assets/forum-avatars/new-bluebell.png" alt="" />
              <span>浇水</span>
            </button>
            <button id="forumGardenPick" type="button">
              <img src="assets/forum-avatars/new-lilybell.png" alt="" />
              <span>采摘</span>
            </button>
            <a href="forum-post.html?id=welcome#forumReplyForm">
              <img src="assets/forum-avatars/new-dandelion.png" alt="" />
              <span>留言</span>
            </a>
          </div>
          <output class="forum-interaction-status" id="forumInteractionStatus" aria-live="polite"></output>
          <section class="forum-checkin-track" aria-label="连续签到进度">
            <div>
              <span>连续签到</span>
              <strong id="forumCheckInStreak">0 天</strong>
            </div>
            <ol id="forumCheckInSteps" aria-label="七天签到进度">
              <li><i></i><span>1</span></li>
              <li><i></i><span>2</span></li>
              <li><i></i><span>3</span></li>
              <li><i></i><span>4</span></li>
              <li><i></i><span>5</span></li>
              <li><i></i><span>6</span></li>
              <li><i></i><span>7</span></li>
            </ol>
            <small id="forumCheckInReward">今日可领取 10 积分</small>
          </section>
          <div class="forum-water-achievement" id="forumWaterAchievement">
            <img src="assets/forum-avatars/new-bluebell.png" alt="" />
            <span>
              <strong>晨露园丁</strong>
              <small id="forumWaterProgress">0 / 3</small>
            </span>
            <i aria-hidden="true"><b id="forumWaterProgressBar"></b></i>
          </div>
        </aside>
      </div>

      <nav class="forum-pagination" id="forumPagination" aria-label="帖子页码">
        <button type="button" data-forum-page="previous" aria-label="上一页">‹</button>
        <span id="forumPageNumbers"></span>
        <button type="button" data-forum-page="next" aria-label="下一页">›</button>
      </nav>
      <output class="visually-hidden" id="forumPageStatus" aria-live="polite"></output>
    </main>

    <div data-site-footer></div>
    <script src="site-shell.js?v=20260731-xhs-profile"></script>
    <script src="forum-auth.js?v=20260729-single-login"></script>
    <script src="forum-data.js?v=20260730-open-topics"></script>
    <script src="forum-board.js?v=20260802-database"></script>
    <script src="forum-compose.js?v=20260802-database"></script>
    <script src="script.js?v=20260728-scroll-stories"></script>
  </body>
</html>
