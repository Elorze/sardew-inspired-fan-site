<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="种种大世界汇集故事、原创画面、社区内容与旗下三款产品。"
    />
    <title>种种大世界</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preload" as="image" href="assets/home-depth-background.png" />
    <link
      rel="preload"
      as="image"
      href="assets/home-watered-spirit-alpha-v1.png"
    />
    <link rel="preload" as="image" href="assets/home-sprite-clover.png" />
    <link rel="preload" as="image" href="assets/home-sprite-flying.png" />
    <link rel="preload" as="image" href="assets/home-depth-logo-cropped.png" />
    <link rel="stylesheet" href="styles.css?v=20260731-social-alignment" />
    <link rel="stylesheet" href="home-experience.css?v=20260731-home-flow-p2" />
    <link rel="stylesheet" href="design-system.css?v=20260801-pixel-rules" />
  </head>
  <body data-page="index.html">
    <div data-site-header></div>

    <main>
      <section class="home-hero" data-home-depth>
        <h1 class="visually-hidden">种种大世界</h1>
        <div class="home-depth-scene" aria-hidden="true">
          <div class="home-depth-layer-wrap home-depth-cloud-wrap">
            <img
              class="home-depth-layer home-depth-cloud"
              src="assets/home-depth-background.png"
              alt=""
              data-image-fit="cover"
              data-image-rendering="smooth"
            />
          </div>

          <div class="home-depth-cast">
            <img
              class="home-sprite home-sprite-lotus"
              src="assets/home-sprite-lotus.png"
              alt=""
              data-image-rendering="pixelated"
            />
            <img
              class="home-sprite home-sprite-cattail"
              src="assets/home-sprite-cattail.png"
              alt=""
              data-image-rendering="pixelated"
            />
            <img
              class="home-sprite home-sprite-clover"
              src="assets/home-sprite-clover.png"
              alt=""
              data-image-rendering="pixelated"
            />
            <img
              class="home-sprite home-sprite-flying"
              src="assets/home-sprite-flying.png"
              alt=""
              data-image-rendering="pixelated"
            />
            <img
              class="home-sprite home-sprite-bluebell"
              src="assets/home-sprite-bluebell.png"
              alt=""
              data-image-rendering="pixelated"
            />
            <img
              class="home-sprite home-sprite-dandelion"
              src="assets/home-sprite-dandelion.png"
              alt=""
              data-image-rendering="pixelated"
            />
          </div>

          <div class="home-depth-logo-wrap">
            <img
              class="home-depth-logo"
              src="assets/home-depth-logo-cropped.png"
              alt=""
              data-image-rendering="pixelated"
            />
          </div>

          <div class="home-stump-spirit-wrap">
            <img
              class="home-stump-composite"
              src="assets/home-watered-spirit-alpha-v1.png"
              alt=""
              data-image-rendering="pixelated"
            />
          </div>
        </div>
      </section>

      <section class="home-landing-intro" aria-label="进入种种大世界">
        <p>
          <span>从浇灌一片土地开始</span>
          <small>Begin by watering a patch of earth.</small>
        </p>
      </section>

      <section class="home-showcase" aria-label="游戏实机画面">
        <div class="home-dual-showcase">
          <div
            class="home-motion-view"
            role="region"
            aria-roledescription="轮播"
            aria-label="自动播放且可手动切换的游戏画面"
            tabindex="0"
          >
            <div class="home-motion-track" data-active-slide="0">
              <figure class="home-motion-slide" aria-hidden="false">
                <img
                  src="assets/gameplay-world.png"
                  alt="种种世界花园实机画面"
                  decoding="async"
                  data-image-fit="cover"
                  data-image-rendering="smooth"
                />
              </figure>
              <figure class="home-motion-slide" aria-hidden="true">
                <img
                  src="assets/gameplay-tavern.png"
                  alt="种种酒馆实机画面"
                  loading="lazy"
                  decoding="async"
                  data-image-fit="cover"
                  data-image-rendering="smooth"
                />
              </figure>
              <figure class="home-motion-slide" aria-hidden="true">
                <img
                  src="assets/gameplay-dandelion.png"
                  alt="蒲公英大世界实机画面"
                  loading="lazy"
                  decoding="async"
                  data-image-fit="cover"
                  data-image-rendering="smooth"
                />
              </figure>
            </div>
            <button
              class="home-motion-arrow home-motion-arrow-prev"
              type="button"
              aria-label="上一幅画面"
              title="上一幅画面"
            >
              <span aria-hidden="true">‹</span>
            </button>
            <button
              class="home-motion-arrow home-motion-arrow-next"
              type="button"
              aria-label="下一幅画面"
              title="下一幅画面"
            >
              <span aria-hidden="true">›</span>
            </button>
          </div>

          <figure class="home-still-view">
            <img
              src="assets/product-world-thumb.png"
              alt="种种世界花园全景静帧"
              loading="lazy"
              decoding="async"
              data-image-fit="cover"
              data-image-rendering="smooth"
            />
          </figure>
        </div>

        <p class="home-color-note home-color-note-bottom">
          <span>慢慢走，每次回来都会遇见新朋友</span>
          <small>Take your time. New friends will be waiting each time you return.</small>
        </p>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="site-shell.js?v=20260731-xhs-profile"></script>
    <script src="script.js?v=20260729-home-depth"></script>
    <script src="home-experience.js?v=20260731-home-flow-p2"></script>
  </body>
</html>
